name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev,reference]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            selftest: dist/PackFilter/PackFilter.exe
          - os: macos-14          # Apple Silicon
            selftest: "dist/Pack Filter.app/Contents/MacOS/Pack Filter"
          - os: macos-15-intel    # Intel Macs
            selftest: "dist/Pack Filter.app/Contents/MacOS/Pack Filter"
          - os: ubuntu-22.04      # older glibc = runs on more distros
            selftest: dist/PackFilter/PackFilter
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - run: pip install ".[dev]"
      - run: python packaging/build.py
      - name: Self-test the packaged app
        if: runner.os != 'Windows'
        run: '"${{ matrix.selftest }}" --self-test'
      - name: Self-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "${{ matrix.selftest }}" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: packfilter-${{ matrix.os }}
          path: |
            dist/PackFilter-*.zip
            dist/PackFilter-*.dmg
            dist/PackFilter-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
