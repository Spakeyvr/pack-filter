[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packfilter"
version = "1.0.0"
description = "Scan rhythm-game song packs (Etterna, StepMania, osu!, ...) and censor sexualized cover art using the anime_dbrating model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",
    "onnxruntime>=1.17",
    "PySide6>=6.6",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller>=6.6"]
# Only used by tests to check our inference matches the reference implementation.
reference = ["dghs-imgutils"]

[project.scripts]
packfilter-cli = "packfilter.cli:main"

[project.gui-scripts]
packfilter = "packfilter.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
packfilter = ["assets/*", "assets/models/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
